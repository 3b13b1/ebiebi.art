<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EBI</title>
  <style>
    a {
      color: inherit;
      text-decoration: none;
      cursor: defautlt;
      pointer-events: none;
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.5);
      color: white;
      padding: 0.5em 1em;
      border-radius: 999px;
      cursor: none;
      z-index: 100;
      font-family: "Sharp", sans-serif;
      backdrop-filter: blur(8px);
    }

    .theme-icon {
      position: fixed;
      top: 20px;
      right: 20px;
      font-size: 2rem;
      z-index: 100;
      color: white;
      filter: none;
      font-family: "Sharp", sans-serif;
    }

    body.light #themeIcon {
      content: "☾";
    }

    body.light {
      background: white;
      color: black;
    }

    body.light .word,
    body.light .pill,
    body.light .popup,
    body.light .trail-pixel {
      color: black;
    }

    body.light .pill {
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.05), 0 0 40px rgba(0, 0, 0, 0.1);
    }

    body.light .trail-pixel {
      background: black;
    }

    body.light .popup {
      background-color: rgba(0, 0, 0, 0.1);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.2);
    }
    @font-face {
      font-family: "Blur";
      src: url("fonts/Redaction100-Bold.otf") format("opentype");
    }

    @font-face {
      font-family: "Sharp";
      src: url("fonts/Redaction50-Bold.otf") format("opentype");
    }
    @font-face {
      font-family: "VG";
      src: url("fonts/VG5000-Regular.otf") format("opentype");
    }

    body {
      margin: 0;
      background: black;
      overflow: hidden;
      height: 100vh;
      font-family: "Blur", sans-serif;
      cursor: none;
    }

    .word {
      position: absolute;
      font-size: 5vw;
      color: white;
      filter: blur(0);
      cursor: none;
      transition: all 0.3s ease;
      font-family: "Sharp", sans-serif;
    }

    .word:hover {
      font-family: "Blur", sans-serif;
    }

    .halo {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 500px;
      height: 500px;
      margin-left: -250px;
      margin-top: -250px;
      background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
      z-index: 0;
      border-radius: 50%;
      filter: blur(30px);
    }

    body.light .halo {
      background: radial-gradient(circle, rgba(0,0,0,0.4) 0%, rgba(255,255,255,0) 70%);
    }

    .pill {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      font-size: 1rem;
      color: white;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid transparent;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.05), 0 0 40px rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 999px;
      cursor: none;
      filter: blur(0);
      font-family: "Sharp", sans-serif;
      transition: all 0.3s ease;
    }

    .pill:hover {
      font-family: "Blur", sans-serif;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .popup {
      width: 80vw;
      max-height: 80vh;
      overflow-y: auto;
      background-color: rgba(255, 255, 255, 0.1);
      padding: 2rem;
      color: white;
      font-family: "Sharp", sans-serif;
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.2);
      filter: none;
    }
    .trail-pixel {
      position: fixed;
      width: 16px;
      height: 16px;
      background: white;
      pointer-events: none;
      opacity: 1;
      filter: drop-shadow(0 0 1px white);
      z-index: 20;
    }

    #themeGlyph {
      display: inline-block;
      text-align: center;
      width: 1em;
    }

    #themeGlyph:hover {
      font-family: "VG";
      filter: none;
      width: 1em;
    }
    
  </style>

</head>
<body>

  <div class="word" id="themeGlyph">☼</div>
  <div class="halo"></div>
  <div class="word" id="manifesto">manifesto</div>
  <div class="word" id="sns">sns</div>
  <div class="word" id="contact"><a href="mailto:ebi@ebiebi.art">contact</a></div>
  <div class="pill">EBI™ 2025</div>
  <div class="overlay" id="popupOverlay">
    <div class="popup">
      <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    const words = document.querySelectorAll('.word');
    const themeGlyph = document.getElementById('themeGlyph');

    themeGlyph.addEventListener('click', () => {
      const isLight = document.body.classList.toggle('light');
      themeGlyph.textContent = isLight ? '☽' : '☼';
    });

    words.forEach(word => {
      // Position initiale aléatoire pour tous les mots, y compris themeGlyph
      gsap.set(word, {
        x: Math.random() * window.innerWidth * 0.8,
        y: Math.random() * window.innerHeight * 0.8
      });

      // Mouvement flottant infini
      const float = () => {
        gsap.to(word, {
          duration: 5 + Math.random() * 5,
          x: "+=" + (Math.random() - 0.5) * 200,
          y: "+=" + (Math.random() - 0.5) * 200,
          ease: "sine.inOut",
          onComplete: float
        });
      };
      float();
    });

    document.getElementById("manifesto").addEventListener("click", (e) => {
      e.stopPropagation();
      document.getElementById("popupOverlay").style.display = "flex";
    });

    document.getElementById("popupOverlay").addEventListener("click", () => {
      document.getElementById("popupOverlay").style.display = "none";
    });

    document.querySelector(".popup").addEventListener("click", (e) => {
      e.stopPropagation();
    });

    // Traînée de pixels suivant la souris
    (() => {
      const trailLength = 9;
      const delayMs = 20;
      const pixels = [];
      let positions = [];
      let lastMouse = { x: -100, y: -100 };

      // Création des éléments DOM pour les pixels
      for (let i = 0; i < trailLength; i++) {
        const div = document.createElement('div');
        div.classList.add('trail-pixel');
        document.body.appendChild(div);
        pixels.push(div);
      }

      window.addEventListener('mousemove', e => {
        lastMouse = { x: e.clientX, y: e.clientY };
        positions.push({ x: e.clientX, y: e.clientY, time: performance.now() });
      });

      function update() {
        const now = performance.now();

        for (let i = 0; i < trailLength; i++) {
          const targetTime = now - i * delayMs;
          let pos = positions.find(p => p.time >= targetTime);
          if (!pos) {
            pos = positions[positions.length - 1] || lastMouse;
          }
          const pixel = pixels[i];
          pixel.style.transform = `translate(${pos.x - 8}px, ${pos.y - 8}px)`;
          pixel.style.opacity = (1 - i / trailLength).toFixed(2);
        }

        positions = positions.filter(p => p.time > now - trailLength * delayMs);

        requestAnimationFrame(update);
      }

      update();
    })();
  </script>
</body>
</html>
